name: SnackHot Crawler & Auto-Deploy

on:
  schedule:
    - cron: "0 */2 * * *"
    - cron: "0 0 * * *"
  workflow_dispatch:

jobs:
  crawl:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install deps
        run: |
          pip install -r crawler/requirements.txt
          pip install playwright
          python -m playwright install chromium
          python -m playwright install-deps chromium

      - name: Run crawler (skip Weibo)
        env:
          LLM_API_KEY: ${{ secrets.DOUBAO_API_KEY }}
          SENSENOVA_API_KEY: ${{ secrets.SENSENOVA_API_KEY }}
          RTH_INGEST_URL: ${{ secrets.RTH_INGEST_URL }}
          RTH_API_KEY: ${{ secrets.RTH_API_KEY }}
          SKIP_WEIBO: "1"
        run: |
          cd crawler
          python main.py