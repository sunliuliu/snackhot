name: SnackHot Crawler & Deploy

on:
  schedule:
    - cron: "0 */2 * * *"    # 每 2 小时跑一次
    - cron: "0 0 * * *"      # 每天 08:00 额外跑一次（早报）
  workflow_dispatch:          # 手动触发按钮

jobs:
  crawl:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - run: pip install -r crawler/requirements.txt

      - name: Run crawler
        env:
          DOUBAO_API_KEY: ${{ secrets.DOUBAO_API_KEY }}
          RTH_INGEST_URL: ${{ secrets.RTH_INGEST_URL }}
          RTH_API_KEY: ${{ secrets.RTH_API_KEY }}
        run: |
          cd crawler
          python main.py

      - uses: actions/upload-artifact@v4
        with:
          name: snackhot-data
          path: crawler/_data/*.json
          retention-days: 7